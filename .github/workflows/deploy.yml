name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: fastapi
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-074bc8abf6e2c64eb
  SERVER_NAME: fastapi-server
  PUBLIC_URL: http://13.205.89.68
  TARGET_PORT: 80
  DOCKERFILE_PATH: .
  SECRET_ID: deptic/fastapi/secrets

jobs:
  build-and-verify:
    name: Build & Smoke Test Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend diagnostics - install requirements
        working-directory: backend
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PYEOF'
          import fastapi, uvicorn, sqlalchemy, jose, passlib, dotenv, multipart
          print("backend imports OK:", fastapi.__version__, sqlalchemy.__version__)
          PYEOF

      - name: Backend diagnostics - compile check
        run: |
          set -e
          python -m py_compile backend/main.py backend/db.py
          echo "py_compile OK"

      - name: Frontend diagnostics - npm install
        working-directory: frontend
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci --legacy-peer-deps; else npm install --legacy-peer-deps; fi

      - name: Frontend diagnostics - lint
        working-directory: frontend
        run: npm run lint || echo "lint reported issues (non-fatal diagnostics)"

      - name: Frontend diagnostics - vite build
        working-directory: frontend
        run: |
          set -e
          npm run build
          test -f dist/index.html && echo "dist/index.html present"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build diagnostics (unified image, no push)
        run: |
          set -e
          docker build --file Dockerfile --tag fastapi-auth:ci .
          docker images fastapi-auth:ci
          echo "unified Dockerfile build OK"

      - name: Container smoke test (nginx + uvicorn on port 80)
        run: |
          set -e
          docker run -d --name smoke -p 80:80 \
            -e SECRET_KEY=cinsecuresmoketestkey \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=30 \
            -e DATABASE_URL=sqlite:////app/data/app.db \
            fastapi-auth:ci
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:80/ || true)
            if [ "$CODE" = "200" ]; then echo "container smoke test OK (HTTP 200)"; break; fi
            sleep 2
          done
          if [ "$CODE" != "200" ]; then docker logs smoke; exit 1; fi
          DOCS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:80/docs || true)
          echo "backend proxy /docs via nginx returned: $DOCS_CODE"
          docker stop smoke || true
          docker rm smoke || true

  deploy:
    name: Build, Push and Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-verify
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Amazon ECR (direct AWS CLI, static creds)
        id: login-ecr
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE from context: $DOCKERFILE_PATH"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM send-command (file-based parameters)
        id: deploy
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=$ECR_REGISTRY/fastapi:latest",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_ARN=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi/secrets --query SecretString --output text)",
              "SECRET_KEY=$(echo \"$SECRET_ARN\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"SECRET_KEY\", d))' 2>/dev/null || echo \"$SECRET_ARN\")",
              "docker run -d --restart always -p 80:80 --name app -e SECRET_KEY=\"$SECRET_KEY\" -e ALGORITHM=HS256 -e ACCESS_TOKEN_EXPIRE_MINUTES=30 -e DATABASE_URL=sqlite:////app/data/app.db $IMAGE_URI",
              "docker ps"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID to $INSTANCE_ID"

      - name: Wait for SSM command completion
        run: |
          set -e
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then echo "SSM deploy succeeded"; exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then echo "SSM deploy failed with status $STATUS"; exit 1; fi
            sleep 5
          done
          echo "SSM command did not complete in time"
          exit 1

  verify:
    name: Public Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for application startup
        run: sleep 20

      - name: Health check public URL (HTTP 200 required)
        run: |
          set -e
          URL="$PUBLIC_URL/"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "attempt $i: HTTP $CODE from $URL"
            if [ "$CODE" = "200" ]; then echo "health check passed"; break; fi
            sleep 5
          done
          if [ "$CODE" != "200" ]; then echo "health check failed: last code $CODE"; exit 1; fi

      - name: Verify backend proxy through nginx (docs endpoint)
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/docs" || true)
          echo "GET $PUBLIC_URL/docs -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then echo "backend health check failed"; exit 1; fi
          echo "deployment verified: frontend and backend reachable at $PUBLIC_URL"