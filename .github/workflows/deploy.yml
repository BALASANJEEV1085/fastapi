name: build-deploy-verify-fastapi-auth

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-007bfc0a89bf74354
  PUBLIC_URL: http://3.7.204.117
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  CONTAINER_PORT: "8000"
  DOCKER_CONTEXT: backend

jobs:
  build-and-push:
    name: Build diagnostics and push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (backend runtime diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (frontend diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend build diagnostics (syntax check)
        working-directory: backend
        run: |
          set -euo pipefail
          python -m py_compile main.py db.py
          echo "backend python syntax OK"
          ls -la

      - name: Frontend build diagnostics (npm ci + vite build + eslint)
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          npm run lint || echo "lint warnings tolerated"
          test -f dist/index.html && echo "frontend dist/index.html OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          IMAGE_TAG="${GITHUB_SHA}"
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          IMAGE_URI="${FULL_IMAGE}:${IMAGE_TAG}"
          {
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "IMAGE_URI=${IMAGE_URI}"
          } >> "$GITHUB_OUTPUT"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "Registry: $ECR_REGISTRY"
          echo "Image:    $IMAGE_URI"

      - name: Docker build diagnostics (metadata load)
        run: |
          set -euo pipefail
          docker buildx build \
            --file backend/Dockerfile \
            --tag "${{ steps.meta.outputs.IMAGE_URI }}" \
            --load \
            backend
          docker image inspect "${{ steps.meta.outputs.IMAGE_URI }}" --format 'IMAGE {{.Id}} SIZE {{.Size}}'
          docker run --rm --entrypoint sh "${{ steps.meta.outputs.IMAGE_URI }}" -c 'python --version && ls /app'

      - name: Login to Amazon ECR (AWS CLI, static credentials)
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --region "$AWS_REGION" --repository-names fastapi || \
          aws ecr create-repository --region "$AWS_REGION" --repository-name fastapi

      - name: Push image to ECR (tag + latest)
        run: |
          set -euo pipefail
          docker tag "${{ steps.meta.outputs.IMAGE_URI }}" "${ECR_REPOSITORY_URI}:latest"
          docker push "${{ steps.meta.outputs.IMAGE_URI }}"
          docker push "${ECR_REPOSITORY_URI}:latest"

  deploy-to-ec2:
    name: Deploy image to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi:${IMAGE_TAG}",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "ENV_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi/secrets --region ap-south-1 --query SecretString --output text)",
              "SECRET_KEY=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"SECRET_KEY\"])')",
              "DATABASE_URL=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"DATABASE_URL\", \"sqlite:///./app.db\"))')",
              "ACCESS_TOKEN_EXPIRE_MINUTES=$(echo \"$ENV_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"ACCESS_TOKEN_EXPIRE_MINUTES\", \"30\"))')",
              "docker run -d --restart always -p 80:8000 --name app -e SECRET_KEY=\"$SECRET_KEY\" -e ALGORITHM=HS256 -e DATABASE_URL=\"$DATABASE_URL\" -e ACCESS_TOKEN_EXPIRE_MINUTES=\"$ACCESS_TOKEN_EXPIRE_MINUTES\" $IMAGE_URI",
              "docker ps --filter name=app --no-trunc"
            ]
          }
          SSMPARAMS
          python3 - << 'PYEOF'
          import json, os
          path = "/tmp/ssm-params.json"
          with open(path) as f:
              payload = json.load(f)
          tag = os.environ.get("IMAGE_TAG", "")
          payload["commands"] = [c.replace("${IMAGE_TAG}", tag) for c in payload["commands"]]
          with open(path, "w") as f:
              json.dump(payload, f, indent=2)
          print("SSM payload ready for tag", tag)
          PYEOF

      - name: Send SSM command to EC2 instance
        id: ssm
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command: ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          COMMAND_ID="${{ steps.ssm.outputs.COMMAND_ID }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) echo "SSM command succeeded"; exit 0 ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "SSM command failed with status $STATUS"
                 aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" || true
                 exit 1 ;;
            esac
          done
          echo "Timed out waiting for SSM command"
          exit 1

  verify-health:
    name: Verify production health (HTTP 200 only)
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -euo pipefail
          URL="${PUBLIC_URL}"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w '%{http_code}' "$URL" || true)
            echo "Attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 500 /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed; last HTTP code: $CODE"
          cat /tmp/health-body || true
          exit 1

      - name: Assert backend API reachable through host mapping
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/docs" || true)
          echo "Backend docs endpoint HTTP code: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Backend API verified on container port 8000 via host port 80"
          else
            echo "Backend endpoint not 200 (got $CODE); deployment verification failed"
            exit 1
          fi