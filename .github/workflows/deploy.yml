name: Build, Deploy & Verify Full-Stack Auth App (EC2 Docker)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-0be898f4b4dbc7e5b
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  PUBLIC_URL: http://43.204.165.22
  CONTAINER_PORT: "80"
  DOCKERFILE_PATH: .

jobs:
  build-and-push:
    name: Build, Diagnose, Push Image
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (frontend lint/build toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Set up Python (backend toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend diagnostics - compile check
        run: |
          set -e
          python -m py_compile backend/main.py backend/db.py
          echo "backend python compile check OK"

      - name: Backend diagnostics - dependencies install check
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -c "import fastapi, uvicorn, sqlalchemy, jose, passlib, dotenv; print('backend imports OK')"

      - name: Frontend diagnostics - npm install
        working-directory: frontend
        run: |
          set -e
          npm install --legacy-peer-deps

      - name: Frontend diagnostics - eslint
        working-directory: frontend
        run: |
          set -e
          npm run lint

      - name: Frontend diagnostics - vite build
        working-directory: frontend
        run: |
          set -e
          npm run build
          test -f dist/index.html && echo "frontend dist/index.html present"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        id: login-ecr
        run: |
          set -e
          REGION="$AWS_REGION"
          ECR_REGISTRY="$(printf '%s' "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build production image (unified Nginx + Uvicorn runtime)
        run: |
          set -e
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          echo "Building $FULL_IMAGE:$GITHUB_SHA and :latest from context: $DOCKERFILE_PATH"
          docker build \
            --file Dockerfile \
            --tag "$FULL_IMAGE:$GITHUB_SHA" \
            --tag "$FULL_IMAGE:latest" \
            "$DOCKERFILE_PATH"
          docker images "$FULL_IMAGE"

      - name: Container smoke test (nginx on port 80 + API proxy)
        run: |
          set -e
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          docker run -d --name smoke \
            -p 8080:80 \
            -e SECRET_KEY=smoketestsecret \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=30 \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            "$FULL_IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null; then
              echo "root page served"; break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then echo "smoke test: root page never became healthy"; docker logs smoke; exit 1; fi
          done
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs || true)"
            if [ "$CODE" = "200" ]; then echo "API docs proxied through nginx OK"; break; fi
            sleep 2
            if [ "$i" -eq 30 ]; then echo "smoke test: /docs never returned 200"; docker logs smoke; exit 1; fi
          done
          docker logs smoke
          docker stop smoke && docker rm smoke

      - name: Push image to Amazon ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "pushed $FULL_IMAGE:$GITHUB_SHA and :latest"

  deploy:
    name: Deploy to EC2 via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve runtime secrets from AWS Secrets Manager
        id: runtime-secrets
        run: |
          set -e
          REGION="$AWS_REGION"
          SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id "$SECRETS_MANAGER_ID" --region "$REGION" --query SecretString --output text)"
          SECRET_KEY="$(printf '%s' "$SECRET_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("SECRET_KEY", d.get("secret_key", "")))')"
          if [ -z "$SECRET_KEY" ]; then
            echo "SECRET_KEY not found in Secrets Manager payload; generating fallback"
            SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          fi
          {
            echo "SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"
          echo "runtime secrets resolved"

      - name: Send SSM command to EC2 instance (pull and run new image)
        id: ssm-deploy
        run: |
          set -e
          REGION="$AWS_REGION"
          IMAGE_URI="$ECR_REPOSITORY_URI:$GITHUB_SHA"
          ECR_REGISTRY="$(printf '%s' "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e SECRET_KEY=$SECRET_KEY -e ALGORITHM=HS256 -e ACCESS_TOKEN_EXPIRE_MINUTES=30 -e DATABASE_URL=sqlite:////app/data/app.db $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "sent SSM command $COMMAND_ID"

      - name: Wait for SSM command completion
        run: |
          set -e
          REGION="$AWS_REGION"
          COMMAND_ID="${{ steps.ssm-deploy.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "CommandInvocations[0].Status" --output text)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then echo "deployment command succeeded"; exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "StandardErrorContent" --output text || true
              exit 1
            fi
            sleep 10
          done
          echo "SSM command did not complete in time"; exit 1

  verify:
    name: Verify Production Health
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -e
          URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || true)"
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "health check passed"; exit 0; fi
            sleep 10
          done
          echo "health check failed: never received HTTP 200 from $URL"; exit 1

      - name: Verify API proxied through nginx (docs endpoint HTTP 200)
        run: |
          set -e
          URL="$PUBLIC_URL"
          for i in $(seq 1 15); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL/docs" || true)"
            echo "attempt $i: /docs HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "API proxy verified"; exit 0; fi
            sleep 5
          done
          echo "API verify failed: /docs never returned HTTP 200"; exit 1