name: Build Deploy Verify FastAPI Auth Backend

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-074bc8abf6e2c64eb
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  CONTAINER_PORT: "8000"
  DOCKER_CONTEXT: backend
  PUBLIC_URL: http://13.205.89.68

jobs:
  build-and-verify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend build diagnostics (syntax and imports)
        working-directory: backend
        run: |
          set -e
          python -m py_compile main.py db.py
          pip install --no-cache-dir -r requirements.txt
          python - <<'PYIMPORT'
          import ast
          for path in ("main.py", "db.py"):
              with open(path, "r", encoding="utf-8") as fh:
                  ast.parse(fh.read(), filename=path)
          print("AST parse OK for backend modules")
          PYIMPORT
          python -c "import fastapi, uvicorn, sqlalchemy, jose, passlib, dotenv; print('backend imports OK')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate AWS CLI and Amazon ECR
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build backend image and export diagnostics
        run: |
          set -e
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date +%s)"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          docker build -t "$FULL_IMAGE" -t "$LATEST_IMAGE" "$DOCKER_CONTEXT"
          docker images "$ECR_REPOSITORY_URI"
          docker inspect "$FULL_IMAGE" --format 'image={{.Id}} config_exposed_ports={{json .Config.ExposedPorts}} cmd={{json .Config.Cmd}}'
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=$LATEST_IMAGE" >> "$GITHUB_ENV"

      - name: Smoke test container locally on port 8000
        run: |
          set -e
          docker run -d --name backend-smoke \
            -p 8000:8000 \
            -e SECRET_KEY=smoketestsecret \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=30 \
            -e DATABASE_URL=sqlite:///./smoke.db \
            "$FULL_IMAGE"
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs || true)"
            if [ "$CODE" = "200" ]; then echo "local smoke test HTTP 200"; break; fi
            sleep 2
          done
          docker logs backend-smoke
          [ "$CODE" = "200" ] || { echo "smoke test failed"; exit 1; }
          docker rm -f backend-smoke

      - name: Push image to Amazon ECR
        run: |
          set -e
          docker push "$FULL_IMAGE"
          docker push "$LATEST_IMAGE"
          echo "pushed $FULL_IMAGE and $LATEST_IMAGE"

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-verify-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend container via SSM RunShellScript
        run: |
          set -e
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi:latest",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi/secrets --region ap-south-1 --query SecretString --output text)",
              "SECRET_KEY=$(printf '%s' \"$SECRET_VALUE\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"SECRET_KEY\",\"\"))')",
              "DATABASE_URL=$(printf '%s' \"$SECRET_VALUE\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"DATABASE_URL\",\"\"))')",
              "ACCESS_TOKEN_EXPIRE_MINUTES=$(printf '%s' \"$SECRET_VALUE\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"ACCESS_TOKEN_EXPIRE_MINUTES\",\"30\"))')",
              "docker run -d --restart always -p 80:8000 --name app -e SECRET_KEY=\"$SECRET_KEY\" -e DATABASE_URL=\"$DATABASE_URL\" -e ACCESS_TOKEN_EXPIRE_MINUTES=\"$ACCESS_TOKEN_EXPIRE_MINUTES\" $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          STATUS="InProgress"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text || echo "InProgress")
            echo "ssm status: $STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ] || [ "$STATUS" = "Delayed" ]; then sleep 5; else echo "SSM command failed: $STATUS"; exit 1; fi
          done
          [ "$STATUS" = "Success" ] || { echo "SSM command did not succeed"; exit 1; }

  verify-production:
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -e
          CODE="000"
          for i in $(seq 1 60); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL" || true)"
            echo "attempt $i http_code=$CODE"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 5
          done
          if [ "$CODE" != "200" ]; then echo "public health check failed"; exit 1; fi
          echo "production health check passed with HTTP 200 at $PUBLIC_URL"