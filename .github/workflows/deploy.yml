name: Build, Deploy & Verify Full-Stack Auth App (EC2 Docker)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-0be898f4b4dbc7e5b
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  PUBLIC_URL: http://43.204.165.22
  CONTAINER_PORT: "80"
  DOCKERFILE_PATH: .

jobs:
  build-and-push:
    name: Build, Diagnose, Push Image
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (frontend lint/build toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Set up Python (backend toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend diagnostics - compile check
        run: |
          set -e
          python -m py_compile backend/main.py backend/db.py
          echo "backend python compile check OK"

      - name: Backend diagnostics - dependencies install check
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -c "import fastapi, uvicorn, sqlalchemy, jose, passlib, dotenv; print('backend imports OK')"

      - name: Frontend diagnostics - npm install
        working-directory: frontend
        run: |
          set -e
          npm install --legacy-peer-deps

      - name: Frontend diagnostics - eslint
        working-directory: frontend
        run: |
          set -e
          npm run lint

      - name: Frontend diagnostics - vite build
        working-directory: frontend
        run: |
          set -e
          npm run build
          test -f dist/index.html && echo "frontend dist/index.html present"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        id: login-ecr
        run: |
          set -e
          REGION="$AWS_REGION"
          ECR_REGISTRY="$(printf '%s' "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build production image (unified Nginx + Uvicorn runtime)
        run: |
          set -e
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          echo "Building $FULL_IMAGE:$GITHUB_SHA and :latest from context: $DOCKERFILE_PATH"
          docker build \
            --file Dockerfile \
            --tag "$FULL_IMAGE:$GITHUB_SHA" \
            --tag "$FULL_IMAGE:latest" \
            "$DOCKERFILE_PATH"
          docker images "$FULL_IMAGE"

      - name: Container smoke test (nginx on port 80 + API proxy)
        run: |
          set -e
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          docker run -d --name smoke \
            -p 8000:80 \
            -e SECRET_KEY=smoketestsecret \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=30 \
            -e DATABASE_URL=sqlite:////app/data/app.db \
            "$FULL_IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true)"
            API_CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs || true)"
            if [ "$CODE" = "200" ] && [ "$API_CODE" = "200" ]; then
              echo "smoke test OK: frontend=$CODE api/docs=$API_CODE"
              break
            fi
            sleep 2
            if [ "$i" = "30" ]; then
              docker logs smoke || true
              echo "smoke test FAILED: frontend=$CODE api/docs=$API_CODE"
              exit 1
            fi
          done
          docker rm -f smoke

      - name: Push image to Amazon ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "pushed $FULL_IMAGE:$GITHUB_SHA and :latest"

      - name: Upload image URI artifact for deploy job
        run: |
          set -e
          mkdir -p /tmp/deploy
          printf '%s:%s\n' "$ECR_REPOSITORY_URI" "$GITHUB_SHA" > /tmp/deploy/image-uri.txt
          cat /tmp/deploy/image-uri.txt

  deploy-and-verify:
    name: Deploy to EC2 via SSM and Verify
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image URI and registry
        id: image
        run: |
          set -e
          IMAGE_URI="$ECR_REPOSITORY_URI:$GITHUB_SHA"
          ECR_REGISTRY="$(printf '%s' "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "ecr_registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "deploying $IMAGE_URI via $ECR_REGISTRY"

      - name: Write SSM commands payload to JSON file
        id: ssm-payload
        run: |
          set -e
          REGION="$AWS_REGION"
          ECR_REGISTRY="${{ steps.image.outputs.ecr_registry }}"
          IMAGE_URI="${{ steps.image.outputs.image_uri }}"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi:IMAGE_SHA_PLACEHOLDER",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e SECRET_KEY=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi/secrets --query SecretString --output text | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"SECRET_KEY\"])') -e ALGORITHM=HS256 -e ACCESS_TOKEN_EXPIRE_MINUTES=30 -e DATABASE_URL=sqlite:////app/data/app.db -v /app/data:/app/data 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi:IMAGE_SHA_PLACEHOLDER",
              "docker image prune -f || true"
            ]
          }
          SSMPARAMS
          sed -i "s|IMAGE_SHA_PLACEHOLDER|$GITHUB_SHA|g" /tmp/ssm-params.json
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        id: ssm-send
        run: |
          set -e
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "sent SSM command $COMMAND_ID to $INSTANCE_ID"

      - name: Wait for SSM command completion
        run: |
          set -e
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"
          COMMAND_ID="${{ steps.ssm-send.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$REGION" \
              --query "Status" --output text || echo "Pending")
            echo "ssm status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "SSM command succeeded"
              break
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" || true
              echo "SSM command failed with status $STATUS"
              exit 1
            fi
            sleep 5
            if [ "$i" = "60" ]; then
              echo "SSM command timed out waiting for success"
              exit 1
            fi
          done

      - name: Health check - public URL must return HTTP 200
        run: |
          set -e
          PUBLIC_URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)"
            echo "attempt $i: HTTP $CODE from $PUBLIC_URL/"
            if [ "$CODE" = "200" ]; then
              echo "health check OK: HTTP 200"
              break
            fi
            sleep 5
            if [ "$i" = "30" ]; then
              echo "health check FAILED: last code $CODE"
              exit 1
            fi
          done

      - name: Health check - API docs proxied through nginx must return HTTP 200
        run: |
          set -e
          PUBLIC_URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/docs" || true)"
            echo "attempt $i: HTTP $CODE from $PUBLIC_URL/docs"
            if [ "$CODE" = "200" ]; then
              echo "api health check OK: HTTP 200"
              break
            fi
            sleep 5
            if [ "$i" = "30" ]; then
              echo "api health check FAILED: last code $CODE"
              exit 1
            fi
          done

      - name: Deployment summary
        run: |
          set -e
          echo "Deployed image: $ECR_REPOSITORY_URI:$GITHUB_SHA"
          echo "Instance: $INSTANCE_ID"
          echo "Public URL: $PUBLIC_URL"
          echo "Container port: $CONTAINER_PORT"