name: Build Deploy Verify Full-Stack FastAPI React (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-0092f595cf0cf8abf
  PUBLIC_URL: http://13.205.250.122
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  CONTAINER_PORT: "80"
  DOCKER_CONTEXT: .

jobs:
  build-and-push:
    name: Build diagnostics and push full-stack image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (matches Dockerfile runtime base image)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20 (matches Dockerfile frontend-builder base image)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build diagnostics - compile backend Python sources
        run: |
          set -euo pipefail
          echo "--- Python compile check (backend) ---"
          python -m py_compile backend/main.py backend/db.py
          echo "py_compile OK"

      - name: Build diagnostics - validate backend requirements.txt
        run: |
          set -euo pipefail
          echo "--- backend/requirements.txt ---"
          cat backend/requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python - <<'PYEOF'
          import fastapi, sqlalchemy, jose, passlib, dotenv, multipart, uvicorn
          print("fastapi", fastapi.__version__)
          print("sqlalchemy", sqlalchemy.__version__)
          print("uvicorn", uvicorn.__version__)
          print("backend dependency import check OK")
          PYEOF

      - name: Build diagnostics - validate frontend dependencies and build
        run: |
          set -euo pipefail
          echo "--- frontend/package.json ---"
          cat frontend/package.json
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          test -f dist/index.html
          echo "frontend vite build OK (dist/index.html present)"

      - name: Build diagnostics - validate root Dockerfile topology
        run: |
          set -euo pipefail
          echo "--- Dockerfile (root context) ---"
          cat Dockerfile
          test -f Dockerfile
          test -f backend/requirements.txt
          test -f backend/main.py
          test -f backend/db.py
          test -f frontend/package.json
          test -f frontend/index.html
          grep -q 'EXPOSE 80' Dockerfile
          grep -q 'uvicorn' Dockerfile
          grep -q 'nginx' Dockerfile
          grep -q 'proxy_pass http://127.0.0.1:8000' Dockerfile
          echo "Dockerfile/context diagnostics OK (context=., container port=80, nginx proxies API to uvicorn 8000)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "Building image: $FULL_IMAGE"

      - name: Configure AWS credentials (direct static credentials, AWS CLI)
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region "$AWS_REGION"

      - name: Login to Amazon ECR (AWS CLI, static credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push full-stack image (context=., port 80)
        run: |
          set -euo pipefail
          docker build -t "$FULL_IMAGE" -f Dockerfile .
          docker push "$FULL_IMAGE"
          echo "Pushed $FULL_IMAGE"

  deploy:
    name: Deploy image to EC2 Docker host via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (direct static credentials, AWS CLI)
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region "$AWS_REGION"

      - name: Deploy to EC2 instance via SSM run-command
        run: |
          set -euo pipefail
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "mkdir -p /opt/app/data",
              "SECRET_KEY=\$(aws secretsmanager get-secret-value --secret-id $SECRETS_MANAGER_ID --region $AWS_REGION --query SecretString --output text || echo change-this-secret-in-production)",
              "docker run -d --restart always -p 80:80 --name app -v /opt/app/data:/app/data -e PYTHONUNBUFFERED=1 -e SECRET_KEY=\"\$SECRET_KEY\" -e ALGORITHM=HS256 -e ACCESS_TOKEN_EXPIRE_MINUTES=30 -e DATABASE_URL=sqlite:////app/data/app.db $IMAGE_URI"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text || echo Pending)
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then echo "SSM deploy success"; exit 0; fi
            if [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ] || [ "$STATUS" = "Delayed" ]; then sleep 10; continue; fi
            echo "SSM command failed with status $STATUS"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" || true
            exit 1
          done
          echo "SSM command timed out"
          exit 1

  verify:
    name: Verify public endpoint health
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          echo "Waiting for nginx+uvicorn stack on $PUBLIC_URL (port 80)..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/body.html -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 300 /tmp/body.html || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $PUBLIC_URL"
          exit 1

      - name: Verify API proxied through nginx (docs endpoint HTTP 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/docs" || true)
            echo "Attempt $i: /docs HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "API proxy health check passed with HTTP 200"
              exit 0
            fi
            sleep 10
          done
          echo "API health check failed: /docs never returned HTTP 200"
          exit 1