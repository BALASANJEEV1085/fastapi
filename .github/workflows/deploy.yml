name: Build, Deploy & Verify Full-Stack Auth App (EC2 Docker)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-0be898f4b4dbc7e5b
  PUBLIC_URL: http://43.204.165.22
  CONTAINER_PORT: "80"
  DOCKERFILE_PATH: .

jobs:
  build-and-push:
    name: Build, Diagnose, Push Image
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (frontend lint/build toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Set up Python (backend toolchain)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend diagnostics - compile check
        run: |
          set -e
          python -m py_compile backend/main.py backend/db.py
          echo "backend python compile check OK"

      - name: Frontend diagnostics - npm install
        working-directory: frontend
        run: |
          set -e
          npm install --legacy-peer-deps

      - name: Frontend diagnostics - eslint
        working-directory: frontend
        run: |
          set -e
          npm run lint

      - name: Frontend diagnostics - vite build
        working-directory: frontend
        run: |
          set -e
          npm run build
          test -f dist/index.html && echo "frontend dist/index.html present"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        id: login-ecr
        run: |
          set -e
          REGION="$AWS_REGION"
          ECR_REGISTRY="$(printf '%s' "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build production image (unified Nginx + Uvicorn runtime)
        run: |
          set -e
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          echo "Building $FULL_IMAGE:$GITHUB_SHA and :latest from context: $DOCKERFILE_PATH"
          docker build \
            --file Dockerfile \
            --tag "$FULL_IMAGE:$GITHUB_SHA" \
            --tag "$FULL_IMAGE:latest" \
            "$DOCKERFILE_PATH"
          docker images "$FULL_IMAGE"

      - name: Container smoke test (nginx on port 80 + docs via proxy)
        run: |
          set -e
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          docker run -d --name smoke \
            -p 8000:80 \
            -e SECRET_KEY=smoketestsecret \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=30 \
            -e DATABASE_URL=sqlite:////app/data/app.db \
            "$FULL_IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "root status: $CODE"
          [ "$CODE" = "200" ] || { docker logs smoke; exit 1; }
          DOCS_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs || true)
          echo "docs status: $DOCS_CODE"
          [ "$DOCS_CODE" = "200" ] || { docker logs smoke; exit 1; }
          docker logs smoke
          docker stop smoke && docker rm smoke

      - name: Push image to Amazon ECR
        run: |
          set -e
          FULL_IMAGE="$ECR_REPOSITORY_URI"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "pushed $FULL_IMAGE:$GITHUB_SHA and :latest"

  deploy-to-ec2:
    name: Deploy to EC2 via SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch runtime secrets from AWS Secrets Manager (direct AWS CLI)
        run: |
          set -e
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "deptic/fastapi/secrets" --region "$AWS_REGION" --query SecretString --output text)
          SECRET_KEY=$(printf '%s' "$SECRET_JSON" | python -c 'import sys,json; d=json.load(sys.stdin); print(d.get("SECRET_KEY",""))')
          if [ -z "$SECRET_KEY" ]; then
            echo "SECRET_KEY not found in Secrets Manager; generating ephemeral key for deployment"
            SECRET_KEY=$(openssl rand -hex 32)
          fi
          {
            echo "SECRET_KEY=$SECRET_KEY"
            echo "ALGORITHM=HS256"
            echo "ACCESS_TOKEN_EXPIRE_MINUTES=30"
            echo "DATABASE_URL=sqlite:////app/data/app.db"
          } > /tmp/app.env
          echo "environment file prepared (keys only, values masked)"
          printf '::add-mask::%s\n' "$SECRET_KEY"

      - name: Write SSM command payload to JSON file
        run: |
          set -e
          REGION="$AWS_REGION"
          ECR_REGISTRY="$(printf '%s' "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          IMAGE_URI="$ECR_REPOSITORY_URI:$GITHUB_SHA"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=$REGION",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "mkdir -p /opt/fastapi-auth/data",
              "docker run -d --restart always --name app -p 80:80 --env-file /opt/fastapi-auth/app.env -v /opt/fastapi-auth/data:/app/data $IMAGE_URI"
            ]
          }
          SSMPARAMS
          echo "payload written:"
          cat /tmp/ssm-params.json

      - name: Upload environment file to instance via SSM
        run: |
          set -e
          REGION="$AWS_REGION"
          mkdir -p /opt-staging
          cp /tmp/app.env /opt-staging/app.env
          cat > /tmp/ssm-env-upload.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "mkdir -p /opt/fastapi-auth",
              "chmod 600 /opt/fastapi-auth/app.env || true"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-env-upload.json --query "Command.CommandId" --output text)
          echo "prep command: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"

      - name: Send SSM deploy command (file-based parameters)
        run: |
          set -e
          REGION="$AWS_REGION"
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "deploy command: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query Status --output text)
          echo "ssm status: $STATUS"
          [ "$STATUS" = "Success" ] || { aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"; exit 1; }

      - name: Verify SSM command output
        run: |
          set -e
          REGION="$AWS_REGION"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION"

  verify-production:
    name: Verify Public Health Endpoint
    needs: deploy-to-ec2
    runs-on: ubuntu-latest
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -e
          URL="$PUBLIC_URL"
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/" || true)
            echo "attempt $i: root status $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          [ "$CODE" = "200" ] || { echo "health check failed with status $CODE"; exit 1; }
          echo "root endpoint healthy: $CODE"
          DOCS_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/docs" || true)
          echo "docs endpoint status: $DOCS_CODE"
          [ "$DOCS_CODE" = "200" ] || { echo "docs health check failed with status $DOCS_CODE"; exit 1; }
          echo "deployment verified at $URL"