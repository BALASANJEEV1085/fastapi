name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: fastapi
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  INSTANCE_ID: i-074bc8abf6e2c64eb
  SERVER_NAME: fastapi-server
  PUBLIC_URL: http://13.205.89.68
  TARGET_PORT: 80
  DOCKERFILE_PATH: .
  SECRET_ID: deptic/fastapi/secrets

jobs:
  build-and-verify:
    name: Build & Smoke Test Stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend diagnostics - install requirements
        working-directory: backend
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PYEOF'
          import fastapi, uvicorn, sqlalchemy, jose, passlib, dotenv, multipart
          print("backend imports OK:", fastapi.__version__, sqlalchemy.__version__)
          PYEOF

      - name: Backend diagnostics - compile check
        run: |
          set -e
          python -m py_compile backend/main.py backend/db.py
          echo "py_compile OK"

      - name: Frontend diagnostics - npm ci/install
        working-directory: frontend
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci --legacy-peer-deps; else npm install --legacy-peer-deps; fi

      - name: Frontend diagnostics - lint
        working-directory: frontend
        run: npm run lint || echo "lint reported issues (non-fatal diagnostics)"

      - name: Frontend diagnostics - vite build
        working-directory: frontend
        run: |
          set -e
          npm run build
          test -f dist/index.html && echo "dist/index.html present"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build diagnostics (unified image, no push)
        run: |
          set -e
          docker build --file Dockerfile --tag fastapi-auth:ci .
          docker images fastapi-auth:ci
          echo "unified Dockerfile build OK"

  deploy:
    name: Build, Push and Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-verify
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Amazon ECR (direct AWS CLI, static creds)
        id: login-ecr
        run: |
          set -e
          export AWS_REGION="ap-south-1"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE from context: $DOCKERFILE_PATH"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM (file-based parameters)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          export AWS_REGION="ap-south-1"
          INSTANCE_ID="$INSTANCE_ID"
          ECR_REGISTRY="${ECR_REGISTRY:-759204735992.dkr.ecr.ap-south-1.amazonaws.com}"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          # Dynamic resolution: if INSTANCE_ID missing/stopped, resolve by tag Name
          if [ -z "$INSTANCE_ID" ] || ! aws ec2 describe-instances --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null | grep -q "running"; then
            echo "==> Resolving active EC2 instance by tag Name=$SERVER_NAME..."
            RESOLVED_ID=$(aws ec2 describe-instances --region "$AWS_REGION" \
              --filters "Name=tag:Name,Values=$SERVER_NAME" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
            if [ -n "$RESOLVED_ID" ] && [ "$RESOLVED_ID" != "None" ]; then
              echo "==> Found instance: $RESOLVED_ID"
              INSTANCE_ID="$RESOLVED_ID"
            else
              echo "ERROR: no running instance found"; exit 1
            fi
          fi
          echo "Deploying to instance: $INSTANCE_ID"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi:latest",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi/secrets --region ap-south-1 --query SecretString --output text)",
              "SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"SECRET_KEY\"])')",
              "docker run -d --restart always -p 80:80 --name app -e SECRET_KEY=\"$SECRET_KEY\" -e ALGORITHM=HS256 -e ACCESS_TOKEN_EXPIRE_MINUTES=30 -e DATABASE_URL=sqlite:////app/data/app.db 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi:latest",
              "for i in $(seq 1 30); do curl -sf http://127.0.0.1:80/ >/dev/null && echo 'container healthy' && exit 0; sleep 2; done; echo 'container health failed'; exit 1"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "SSM command failed with status $STATUS"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true; exit 1 ;;
            esac
          done
          [ "$STATUS" = "Success" ] || { echo "SSM command timed out"; exit 1; }

      - name: Verify deployment - health check (HTTP 200 required)
        run: |
          set -e
          URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health.body -w "%{http_code}" "$URL/" || true)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "health check passed"
              head -c 300 /tmp/health.body || true
              exit 0
            fi
            sleep 5
          done
          echo "health check failed; last code: $CODE"
          exit 1

      - name: Verify deployment - API docs endpoint (HTTP 200 required)
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/docs")
          echo "GET /docs -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then exit 1; fi
          CODE2=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/openapi.json")
          echo "GET /openapi.json -> HTTP $CODE2"
          if [ "$CODE2" != "200" ]; then exit 1; fi
          echo "API verification passed"