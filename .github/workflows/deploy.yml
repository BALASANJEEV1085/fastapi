name: Build Deploy Verify Full-Stack FastAPI React (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-0092f595cf0cf8abf
  PUBLIC_URL: http://13.205.250.122
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  CONTAINER_PORT: "80"
  DOCKER_CONTEXT: .

jobs:
  build-and-push:
    name: Build diagnostics and push full-stack image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (matches Dockerfile runtime base image)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20 (matches Dockerfile frontend-builder base image)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build diagnostics - compile backend Python sources
        run: |
          set -euo pipefail
          echo "--- Python compile check (backend) ---"
          python -m py_compile backend/main.py backend/db.py
          echo "py_compile OK"

      - name: Build diagnostics - validate backend requirements.txt
        run: |
          set -euo pipefail
          echo "--- backend/requirements.txt ---"
          cat backend/requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python - <<'PYEOF'
          import fastapi, sqlalchemy, jose, passlib, dotenv, multipart, uvicorn
          print("fastapi", fastapi.__version__)
          print("sqlalchemy", sqlalchemy.__version__)
          print("uvicorn", uvicorn.__version__)
          print("backend dependency import check OK")
          PYEOF

      - name: Build diagnostics - validate frontend dependencies and build
        run: |
          set -euo pipefail
          echo "--- frontend/package.json ---"
          cat frontend/package.json
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          test -f dist/index.html
          echo "frontend vite build OK (dist/index.html present)"

      - name: Build diagnostics - validate root Dockerfile topology
        run: |
          set -euo pipefail
          echo "--- Dockerfile (root context) ---"
          cat Dockerfile
          test -f Dockerfile
          test -f backend/requirements.txt
          test -f backend/main.py
          test -f backend/db.py
          test -f frontend/package.json
          test -f frontend/index.html
          grep -q 'EXPOSE 80' Dockerfile
          grep -q 'uvicorn' Dockerfile
          grep -q 'nginx' Dockerfile
          grep -q 'proxy_pass http://127.0.0.1:8000' Dockerfile
          echo "Dockerfile/context diagnostics OK (context=., container port=80, nginx proxies API to uvicorn 8000)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "Image: $FULL_IMAGE"

      - name: Docker login to ECR (static AWS credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push full-stack image to ECR
        run: |
          set -euo pipefail
          docker build -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" -t "$ECR_REPOSITORY_URI:latest" "$DOCKER_CONTEXT"
          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_URI:latest"
          echo "Pushed $ECR_REPOSITORY_URI:$IMAGE_TAG and :latest"

  deploy:
    name: Deploy image to EC2 Docker host via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 instance via SSM send-command
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          IMAGE_URI="${{ needs.build-and-push.outputs.image_uri }}"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -euo pipefail",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_KEY=\$(aws secretsmanager get-secret-value --secret-id $SECRETS_MANAGER_ID --region $AWS_REGION --query SecretString --output text)",
              "docker run -d --restart always -p $CONTAINER_PORT:$CONTAINER_PORT --name app -e PYTHONUNBUFFERED=1 -e SECRET_KEY=\$SECRET_KEY -e ALGORITHM=HS256 -e ACCESS_TOKEN_EXPIRE_MINUTES=30 -e DATABASE_URL=sqlite:////app/data/app.db -v app_data:/app/data $IMAGE_URI",
              "docker ps --filter name=app"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: SSM status=$STATUS"
            if [ "$STATUS" = "Success" ]; then break; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then echo "SSM command failed"; exit 1; fi
            sleep 10
          done
          if [ "$STATUS" != "Success" ]; then echo "SSM command did not succeed in time"; exit 1; fi
          echo "SSM deploy command succeeded"

  verify:
    name: Verify deployment health over HTTP 200
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check - frontend root must return HTTP 200
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 10
          done
          if [ "$CODE" != "200" ]; then echo "Health check failed: root returned $CODE"; exit 1; fi
          echo "Root health check OK (HTTP 200)"

      - name: Health check - FastAPI docs through nginx proxy must return HTTP 200
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/docs" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            sleep 10
          done
          if [ "$CODE" != "200" ]; then echo "Health check failed: /docs returned $CODE"; exit 1; fi
          echo "API proxy health check OK (HTTP 200)"

      - name: Health check - openapi.json through nginx proxy must return HTTP 200
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/openapi.json")
          echo "openapi.json HTTP $CODE"
          if [ "$CODE" != "200" ]; then echo "Health check failed: openapi.json returned $CODE"; exit 1; fi
          echo "Deployment verified: $PUBLIC_URL serves frontend and proxied FastAPI with HTTP 200"