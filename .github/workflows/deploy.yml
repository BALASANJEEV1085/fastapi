name: Build Deploy Verify Full-Stack FastAPI React (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-0092f595cf0cf8abf
  PUBLIC_URL: http://13.205.250.122
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  CONTAINER_PORT: "80"
  DOCKER_CONTEXT: .

jobs:
  build-and-push:
    name: Build diagnostics and push full-stack image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (matches Dockerfile runtime base image)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20 (matches Dockerfile frontend-builder base image)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build diagnostics - compile backend Python sources
        run: |
          set -euo pipefail
          echo "--- Python compile check (backend) ---"
          python -m py_compile backend/main.py backend/db.py
          echo "py_compile OK"

      - name: Build diagnostics - validate backend requirements.txt
        run: |
          set -euo pipefail
          echo "--- backend/requirements.txt ---"
          cat backend/requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python - <<'PYEOF'
          import fastapi, sqlalchemy, jose, passlib, dotenv, multipart, uvicorn
          print("fastapi", fastapi.__version__)
          print("sqlalchemy", sqlalchemy.__version__)
          print("uvicorn", uvicorn.__version__)
          print("backend dependency import check OK")
          PYEOF

      - name: Build diagnostics - validate frontend dependencies and build
        run: |
          set -euo pipefail
          echo "--- frontend/package.json ---"
          cat frontend/package.json
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          test -f dist/index.html
          echo "frontend vite build OK (dist/index.html present)"

      - name: Build diagnostics - validate root Dockerfile topology
        run: |
          set -euo pipefail
          echo "--- Dockerfile (root context) ---"
          cat Dockerfile
          test -f Dockerfile
          test -f backend/requirements.txt
          test -f backend/main.py
          test -f backend/db.py
          test -f frontend/package.json
          test -f frontend/index.html
          grep -q 'EXPOSE 80' Dockerfile
          grep -q 'uvicorn' Dockerfile
          grep -q 'nginx' Dockerfile
          grep -q 'proxy_pass http://127.0.0.1:8000' Dockerfile
          echo "Dockerfile/context diagnostics OK (context=., container port=80, nginx proxies API to uvicorn 8000)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "Image: $FULL_IMAGE"

      - name: Docker build metadata (buildkit inline cache)
        run: |
          set -euo pipefail
          cat > /tmp/build-metadata.json <<META
          {
            "image": "$FULL_IMAGE",
            "tag": "$IMAGE_TAG",
            "context": "$DOCKER_CONTEXT",
            "container_port": $CONTAINER_PORT
          }
          META
          cat /tmp/build-metadata.json

      - name: Build full-stack image (root context, nginx+uvicorn single container)
        run: |
          set -euo pipefail
          docker build \
            -t "$FULL_IMAGE" \
            -t "$ECR_REPOSITORY_URI:latest" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$DOCKER_CONTEXT"
          docker image inspect "$FULL_IMAGE" --format 'Built image {{.Id}} size={{.Size}}'

      - name: Smoke test image locally (container port 80 must serve HTTP 200)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:80 -e SECRET_KEY=ci-smoke-test-secret "$FULL_IMAGE"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            if [ "$CODE" = "200" ]; then echo "local smoke check HTTP 200 on /"; break; fi
            sleep 2
          done
          [ "${CODE:-0}" = "200" ] || { docker logs smoke; echo "smoke test failed"; exit 1; }
          API_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs || true)
          echo "proxied API /docs via nginx returned HTTP $API_CODE"
          docker rm -f smoke

      - name: ECR login with static credentials (AWS CLI, no OIDC)
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest"
          echo "Pushed $FULL_IMAGE and :latest"

  deploy-to-ec2:
    name: Deploy image to EC2 via SSM and restart container
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSM command payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          set -euo pipefail
          cat > /tmp/ssm-params.json <<SSMPARAMS
          {
            "commands": [
              "set -euo pipefail",
              "export AWS_DEFAULT_REGION=$AWS_REGION",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${ECR_REPOSITORY_URI%%/*}",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id $SECRETS_MANAGER_ID --query SecretString --output text 2>/dev/null || echo '')",
              "SECRET_KEY=$(echo \"$SECRET_VALUE\" | python3 -c 'import sys,json;print(json.load(sys.stdin).get(\"SECRET_KEY\",\"change-this-secret-in-production\"))' 2>/dev/null || echo change-this-secret-in-production)",
              "mkdir -p /opt/app/data",
              "docker run -d --restart always -p $CONTAINER_PORT:$CONTAINER_PORT --name app -v /opt/app/data:/app/data -e PYTHONUNBUFFERED=1 -e SECRET_KEY=\"$SECRET_KEY\" -e ALGORITHM=HS256 -e ACCESS_TOKEN_EXPIRE_MINUTES=30 -e DATABASE_URL=sqlite:////app/data/app.db $IMAGE_URI",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          echo "SSM payload written"

      - name: Send SSM command to EC2 instance
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "attempt $i: $STATUS"
            case "$STATUS" in
              Success) echo "SSM command succeeded"; break ;;
              Failed|TimedOut|Cancelled) echo "SSM command failed"; exit 1 ;;
            esac
            sleep 5
          done
          [ "$STATUS" = "Success" ] || { echo "SSM command did not succeed"; exit 1; }
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text

  verify-deployment:
    name: Verify public endpoint returns HTTP 200
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check public URL (nginx port 80, frontend + proxied API)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then echo "health check failed: HTTP $CODE"; exit 1; fi
          echo "public health check OK: HTTP 200 at $PUBLIC_URL/"

      - name: Health check proxied FastAPI docs through nginx
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/docs" || true)
          echo "GET $PUBLIC_URL/docs -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then echo "API proxy health check failed"; exit 1; fi
          echo "API proxy health check OK"

      - name: Record deployment outputs
        run: |
          set -euo pipefail
          cat <<EOF
          public_ip=13.205.250.122
          public_url=$PUBLIC_URL
          alb_dns_name=13.205.250.122
          instance_id=$INSTANCE_ID
          ecr_repo_url=$ECR_REPOSITORY_URI
          security_group_id=sg-097f4619950da0707
          iam_instance_profile=fastapi-instance-profile
          iam_role=fastapi-ec2-role
          EOF
          echo "deployment verified"