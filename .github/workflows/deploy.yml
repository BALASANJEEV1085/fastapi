name: build-deploy-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-0eaccedc87f24ab31
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  CONTAINER_PORT: "8000"
  PUBLIC_URL: http://13.232.10.48
  DOCKER_CONTEXT: backend

jobs:
  build-and-push:
    name: Build backend image and push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (backend syntax diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (frontend lint/build diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend build diagnostics (compile FastAPI sources)
        working-directory: backend
        run: |
          set -euo pipefail
          python -m py_compile main.py db.py
          python - <<'PYEOF'
          import ast, pathlib
          for p in sorted(pathlib.Path(".").glob("*.py")):
              ast.parse(p.read_text(), filename=str(p))
              print(f"AST OK: {p}")
          PYEOF
          echo "--- requirements.txt ---"
          cat requirements.txt

      - name: Frontend build diagnostics (npm ci, lint, vite build)
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json found; using npm install"
            npm install --no-audit --no-fund
          fi
          npm run lint || echo "lint reported issues; continuing diagnostics"
          npm run build
          test -f dist/index.html && echo "frontend dist/index.html produced"

      - name: Configure AWS credentials (static AWS CLI)
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"
          echo "Registry: $ECR_REGISTRY"
          echo "Image:    $FULL_IMAGE"

      - name: Docker buildx diagnostics (build backend context)
        run: |
          set -euo pipefail
          docker buildx build \
            --file "$DOCKER_CONTEXT/Dockerfile" \
            --tag "${{ steps.meta.outputs.image_uri }}" \
            --tag "$ECR_REPOSITORY_URI:latest" \
            --load \
            "$DOCKER_CONTEXT"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep fastapi || true

      - name: ECR login (direct AWS CLI)
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Push image to ECR
        run: |
          set -euo pipefail
          docker push "${{ steps.meta.outputs.image_uri }}"
          docker push "$ECR_REPOSITORY_URI:latest"

  deploy-to-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static AWS CLI)
        run: |
          set -euo pipefail
          aws sts get-caller-identity --region "$AWS_REGION"

      - name: Write SSM commands payload to JSON file
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -euo pipefail",
              "export REGION=$AWS_REGION",
              "export ECR_REGISTRY=$ECR_REGISTRY",
              "export IMAGE_URI=$IMAGE_URI",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "ENV_VARS=$(aws secretsmanager get-secret-value --secret-id $SECRETS_MANAGER_ID --region $REGION --query SecretString --output text)",
              "docker run -d --restart always --name app -p 80:$CONTAINER_PORT -e SECRET_KEY=$(echo $ENV_VARS | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"SECRET_KEY\"])') -e DATABASE_URL=$(echo $ENV_VARS | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"DATABASE_URL\"])') -e ACCESS_TOKEN_EXPIRE_MINUTES=$(echo $ENV_VARS | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"ACCESS_TOKEN_EXPIRE_MINUTES\"])') $IMAGE_URI"
            ]
          }
          SSMPARAMS
          echo "--- /tmp/ssm-params.json ---"
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: status=$STATUS"
            case "$STATUS" in
              Success) echo "SSM command succeeded"; exit 0 ;;
              InProgress|Pending|Delayed) sleep 10 ;;
              *) echo "SSM command failed with status $STATUS"
                 aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" || true
                 exit 1 ;;
            esac
          done
          echo "Timed out waiting for SSM command"
          exit 1

  verify:
    name: Verify deployment health
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w '%{http_code}' "$PUBLIC_URL/docs" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 200 /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          CODE_ROOT=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL" || true)
          echo "Final fallback probe of $PUBLIC_URL returned HTTP $CODE_ROOT"
          if [ "$CODE_ROOT" = "200" ]; then
            echo "Root health check passed with HTTP 200"
            exit 0
          fi
          echo "Health check failed: no HTTP 200 response"
          exit 1