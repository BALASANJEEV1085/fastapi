name: build-deploy-verify-fastapi-auth

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-007bfc0a89bf74354
  PUBLIC_URL: http://3.7.204.117
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  CONTAINER_PORT: "80"
  DOCKER_CONTEXT: .

jobs:
  build-and-push:
    name: Build diagnostics and push unified image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.IMAGE_TAG }}
      image_uri: ${{ steps.meta.outputs.IMAGE_URI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (backend runtime diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (frontend diagnostics)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend build diagnostics (syntax check)
        working-directory: backend
        run: |
          set -euo pipefail
          python -m py_compile main.py db.py
          echo "backend python syntax OK"
          ls -la

      - name: Frontend build diagnostics (npm install + vite build + eslint)
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install --legacy-peer-deps; fi
          npm run build
          npm run lint || echo "lint warnings tolerated"
          test -f dist/index.html && echo "frontend dist/index.html OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          {
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "IMAGE_URI=${IMAGE_URI}"
          } >> "$GITHUB_OUTPUT"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "Registry: ${ECR_REGISTRY}"
          echo "Image:    ${IMAGE_URI}"

      - name: Docker build diagnostics (root multi-stage Dockerfile, metadata load)
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --tag "${{ steps.meta.outputs.IMAGE_URI }}" \
            --load \
            .
          docker image inspect "${{ steps.meta.outputs.IMAGE_URI }}" --format 'IMAGE {{.Id}} SIZE {{.Size}}'
          docker run --rm --entrypoint sh "${{ steps.meta.outputs.IMAGE_URI }}" -c 'nginx -v && python3 --version && ls /app && ls /usr/share/nginx/html'

      - name: Login to Amazon ECR (AWS CLI, static credentials)
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --region "$AWS_REGION" --repository-names fastapi || \
          aws ecr create-repository --region "$AWS_REGION" --repository-name fastapi

      - name: Push image to ECR (tag + latest)
        run: |
          set -euo pipefail
          docker tag "${{ steps.meta.outputs.IMAGE_URI }}" "${ECR_REPOSITORY_URI}:latest"
          docker push "${{ steps.meta.outputs.IMAGE_URI }}"
          docker push "${ECR_REPOSITORY_URI}:latest"
          echo "pushed ${{ steps.meta.outputs.IMAGE_URI }} and :latest"

  deploy-to-ec2:
    name: Deploy unified container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch app secrets from AWS Secrets Manager and build env file
        run: |
          set -euo pipefail
          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "$SECRETS_MANAGER_ID" \
            --region "$AWS_REGION" \
            --query SecretString --output text)"
          {
            echo "SECRET_KEY=$(echo "$SECRET_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("SECRET_KEY",""))')"
            echo "ALGORITHM=$(echo "$SECRET_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("ALGORITHM","HS256"))')"
            echo "ACCESS_TOKEN_EXPIRE_MINUTES=$(echo "$SECRET_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("ACCESS_TOKEN_EXPIRE_MINUTES","30"))')"
          } > /tmp/app.env
          echo "env file prepared (values redacted)"

      - name: Write SSM command payload to JSON file
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          set -euo pipefail
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          cat > /tmp/ssm-params.json << SSMPARAMS
          {
            "commands": [
              "set -e",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "mkdir -p /opt/fastapi-auth/data",
              "printf '%s\n' $(cat /dev/null) > /opt/fastapi-auth/app.env || true",
              "docker run -d --restart always -p 80:80 --name app --env-file /opt/fastapi-auth/app.env -v /opt/fastapi-auth/data:/app/data $IMAGE_URI"
            ]
          }
          SSMPARAMS
          echo "payload written"; cat /tmp/ssm-params.json

      - name: Inject secrets into SSM payload env file line
        run: |
          set -euo pipefail
          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "$SECRETS_MANAGER_ID" \
            --region "$AWS_REGION" \
            --query SecretString --output text)"
          ENV_LINES="$(echo "$SECRET_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(";".join(f"{k}={v}" for k,v in d.items()))')"
          python3 - << PYEOF
          import json
          with open('/tmp/ssm-params.json') as f:
              payload = json.load(f)
          env_lines = """$ENV_LINES"""
          payload["commands"][5] = f"printf '%s\\n' '{env_lines}' | tr ';' '\\n' > /opt/fastapi-auth/app.env"
          with open('/tmp/ssm-params.json','w') as f:
              json.dump(payload, f, indent=2)
          PYEOF
          echo "secret env injection configured (values not logged)"

      - name: Send SSM run-command to EC2 instance
        id: ssm
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "sent command ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.COMMAND_ID }}" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.COMMAND_ID }}" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query Status --output text)
          echo "ssm status: ${STATUS}"
          [ "$STATUS" = "Success" ]

  verify-health:
    name: Verify production health over HTTP
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "health check failed: never received HTTP 200"
          exit 1

      - name: Verify API docs endpoint proxies to backend (HTTP 200)
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/docs" || true)
          echo "docs endpoint -> HTTP $CODE"
          [ "$CODE" = "200" ]