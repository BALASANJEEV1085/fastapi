name: Build Deploy Verify FastAPI Auth Backend (EC2 Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi
  INSTANCE_ID: i-0092f595cf0cf8abf
  PUBLIC_URL: http://13.205.250.122
  SECRETS_MANAGER_ID: deptic/fastapi/secrets
  CONTAINER_PORT: "8000"
  DOCKER_CONTEXT: backend

jobs:
  build-and-push:
    name: Build diagnostics and push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (matches backend/Dockerfile base image)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build diagnostics - compile backend Python sources
        run: |
          set -euo pipefail
          echo "--- Python compile check (backend) ---"
          python -m py_compile backend/main.py backend/db.py
          echo "py_compile OK"

      - name: Build diagnostics - validate backend requirements.txt
        run: |
          set -euo pipefail
          echo "--- requirements.txt ---"
          cat backend/requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python - <<'PYEOF'
          import fastapi, sqlalchemy, jose, passlib, dotenv, multipart, uvicorn
          print("fastapi", fastapi.__version__)
          print("sqlalchemy", sqlalchemy.__version__)
          print("uvicorn", uvicorn.__version__)
          print("backend dependency import check OK")
          PYEOF

      - name: Build diagnostics - validate docker-compose topology and Dockerfile
        run: |
          set -euo pipefail
          echo "--- docker-compose.yml ---"
          cat docker-compose.yml
          echo "--- backend/Dockerfile ---"
          cat backend/Dockerfile
          test -f backend/Dockerfile
          test -f backend/requirements.txt
          test -f backend/main.py
          test -f backend/db.py
          grep -q 'EXPOSE 8000' backend/Dockerfile
          grep -q 'uvicorn' backend/Dockerfile
          echo "Dockerfile/context diagnostics OK (context=backend, port=8000)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag and URI
        id: meta
        run: |
          set -euo pipefail
          IMAGE_TAG="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$IMAGE_TAG"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_uri=$FULL_IMAGE"
          } >> "$GITHUB_OUTPUT"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_ENV"
          echo "Building image: $FULL_IMAGE"

      - name: Configure AWS credentials (direct static credentials, AWS CLI)
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region "$AWS_REGION"

      - name: Login to Amazon ECR (AWS CLI, static credentials)
        run: |
          set -euo pipefail
          ECR_REGISTRY="$(echo "$ECR_REPOSITORY_URI" | cut -d'/' -f1)"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image (context backend) and push to ECR
        run: |
          set -euo pipefail
          docker build -t "$FULL_IMAGE" -t "$ECR_REPOSITORY_URI:latest" ./backend
          docker push "$FULL_IMAGE"
          docker push "$ECR_REPOSITORY_URI:latest"
          echo "Pushed $FULL_IMAGE and latest tag"

  deploy-to-ec2:
    name: Deploy container to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (direct static credentials, AWS CLI)
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region "$AWS_REGION"

      - name: Write SSM commands payload to JSON file
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -euo pipefail",
              "REGION=ap-south-1",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/fastapi:${IMAGE_TAG}",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/fastapi/secrets --region $REGION --query SecretString --output text)",
              "SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"SECRET_KEY\"])')",
              "DATABASE_URL=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"DATABASE_URL\"])')",
              "ACCESS_TOKEN_EXPIRE_MINUTES=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"ACCESS_TOKEN_EXPIRE_MINUTES\"])')",
              "docker run -d --restart always -p 80:8000 --name app -e SECRET_KEY=\"$SECRET_KEY\" -e ALGORITHM=HS256 -e ACCESS_TOKEN_EXPIRE_MINUTES=\"$ACCESS_TOKEN_EXPIRE_MINUTES\" -e DATABASE_URL=\"$DATABASE_URL\" $IMAGE_URI"
            ]
          }
          SSMPARAMS
          python3 - <<'PYEOF'
          import json
          with open('/tmp/ssm-params.json') as f:
              data = json.load(f)
          content = "\n".join(data["commands"])
          content = content.replace("${IMAGE_TAG}", "${{ needs.build-and-push.outputs.image_tag }}")
          data["commands"] = content.split("\n")
          with open('/tmp/ssm-params.json', 'w') as f:
              json.dump(data, f, indent=2)
          print("SSM payload written and templated with image tag")
          PYEOF

      - name: Send SSM command to EC2 instance
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Dispatched SSM command: $COMMAND_ID"

      - name: Wait for SSM command completion
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "SSM deploy command succeeded"
              exit 0
            fi
            case "$STATUS" in
              Failed|Cancelled|TimedOut)
                echo "SSM command failed with status $STATUS"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "SSM command timed out"
          exit 1

  verify-health:
    name: Verify production health (HTTP 200 only)
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Health check public URL until HTTP 200
        run: |
          set -euo pipefail
          URL="$PUBLIC_URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/health-body -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Health check passed with HTTP 200"
              head -c 500 /tmp/health-body || true
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: never received HTTP 200 from $URL"
          exit 1

      - name: Verify backend API docs endpoint returns HTTP 200
        run: |
          set -euo pipefail
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/docs" || true)
          echo "GET $PUBLIC_URL/docs -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Backend Swagger docs reachable through port 80 mapping"
          else
            echo "Docs endpoint not 200 (non-fatal informational check)"
          fi